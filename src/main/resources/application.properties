server.address=${HOST:127.0.0.1}
server.port=${PORT:4000}
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:quan_ly_phong_gym}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=1
spring.jackson.time-zone=UTC
spring.sql.init.mode=never
server.error.include-message=never
spring.web.resources.cache.cachecontrol.no-cache=true
